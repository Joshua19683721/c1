name: CI

# Runs the ReadExpress-CoT test suite on every push and pull request.
#
# The workflow installs requirements-ci.txt, a deliberately lean subset:
# openai-whisper and sounddevice are ~2 GB and are only needed for the
# optional speech-input feature, which the tests never exercise (src.speech
# imports them lazily and degrades gracefully when they are missing).
# Installing them here would cost minutes per run for no extra coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included on purpose: the speech path and the file paths
        # in this project are not platform-neutral.
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10']
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Byte-compile every module
        # Fast gate: catches a syntax error before the slower test run, and
        # proves app.py imports cleanly on this interpreter.
        run: python -m compileall -q app.py src tests

      - name: Report the environment
        # Recorded in the run summary so a future failure can be diagnosed
        # without downloading the (auth-gated) raw logs.
        run: |
          {
            echo "### Environment"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| os | $RUNNER_OS |"
            echo "| python | $(python -VV | tr -d '\n') |"
            echo "| streamlit | $(python -c 'import streamlit; print(streamlit.__version__)') |"
            echo "| PyYAML | $(python -c 'import yaml; print(yaml.__version__)') |"
            echo "| pytest | $(python -m pytest --version 2>&1 | head -1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the content library self-check
        # src/content.py asserts its own invariants on import; this makes that
        # a reported CI signal instead of a silently skipped check.
        run: python -c "import src.content as c; print(len(c.ARTICLES), 'articles, each with', len(c.build_lesson(c.ARTICLES[0].id)), 'questions')"

      - name: Check the category modules against the house rules
        # A distractor that is only a word swap of the right answer looks fine
        # to a reviewer reading the file, but the student answers out loud:
        # the matcher compares by bigram overlap and would pick either option,
        # so a correct answer stops being recoverable. The same goes for an
        # explanation that merely copies an option, a banned phrase the
        # matcher can latch onto by accident, and latin text the speech
        # recogniser renders wrong. None of it is visible to the eye, so
        # tools/check_category.py reads each module with `ast` and reports the
        # line number and the offending strings. It never imports
        # src.content, so a category being written elsewhere in the repo
        # cannot break this step for everyone else.
        run: python tools/check_category.py

      - name: Run the test suite
        # The full output is mirrored into the run summary. The raw job log is
        # behind an authenticated endpoint, so without this a failure is
        # invisible to anyone who cannot export logs.
        run: |
          set -o pipefail
          python -m pytest tests -v --tb=long 2>&1 | tee pytest-output.txt
          {
            echo "### pytest"
            echo ""
            echo '```text'
            cat pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pytest output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}
          path: pytest-output.txt
          retention-days: 7
